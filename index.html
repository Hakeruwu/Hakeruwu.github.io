<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎 Diamond Clicker</title>

<style>
    * {
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0d1117;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    h1 {
        margin-top: 40px;
        font-size: 42px;
    }

    #diamonds {
        font-size: 30px;
        margin-top: 20px;
    }

    #power {
        font-size: 18px;
        color: #58a6ff;
        margin-top: 10px;
    }

    /* Main Diamond */
    #diamond {
        width: 190px;
        height: 190px;
        background: linear-gradient(
            135deg,
            #79c0ff,
            #2188ff,
            #005cc5
        );
        transform: rotate(45deg);
        margin: 90px auto;
        cursor: pointer;
        border: 4px solid #a5d8ff;
        box-shadow: 0 0 40px #2188ff;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #diamondText {
        transform: rotate(-45deg);
        font-size: 25px;
        font-weight: bold;
    }

    #diamond:active {
        transform: rotate(45deg) scale(0.9);
    }

    /* Shop Arrow */
    #shopArrow {
        position: fixed;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        background: #21262d;
        border: 2px solid #58a6ff;
        border-right: none;
        padding: 18px 12px;
        font-size: 25px;
        cursor: pointer;
        border-radius: 12px 0 0 12px;
        z-index: 20;
    }

    /* Shop */
    #shop {
        position: fixed;
        right: -330px;
        top: 0;
        width: 330px;
        height: 100%;
        background: #161b22;
        border-left: 2px solid #30363d;
        padding: 30px;
        transition: right 0.3s ease;
        z-index: 15;
    }

    #shop.open {
        right: 0;
    }

    #closeShop {
        position: absolute;
        left: 15px;
        top: 20px;
        background: #21262d;
        color: white;
        border: 2px solid #58a6ff;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 20px;
        cursor: pointer;
    }

    #shop h2 {
        margin-top: 60px;
        font-size: 30px;
    }

    .upgrade {
        width: 100%;
        padding: 16px;
        margin: 12px 0;
        background: #21262d;
        color: white;
        border: 2px solid #30363d;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    .upgrade:hover {
        background: #30363d;
        border-color: #58a6ff;
        transform: scale(1.03);
    }

    #message {
        position: fixed;
        bottom: 30px;
        width: 100%;
        font-size: 18px;
    }

    /* Red Bonus Diamond */
    .redDiamond {
        position: fixed;
        width: 110px;
        height: 110px;

        background: linear-gradient(
            135deg,
            #ff7777,
            #ff0000,
            #8b0000
        );

        border: 4px solid #ffaaaa;
        transform: rotate(45deg);
        box-shadow: 0 0 40px red;
        cursor: pointer;
        z-index: 10;

        animation: moveDiamond 8s linear forwards;
    }

    .redDiamondText {
        transform: rotate(-45deg);
        font-size: 21px;
        font-weight: bold;
        margin-top: 40px;
        color: white;
    }

    @keyframes moveDiamond {
        from {
            left: -140px;
        }

        to {
            left: 110%;
        }
    }
</style>
</head>

<body>

<h1>💎 Diamond Clicker</h1>

<div id="diamonds">💎 0</div>
<div id="power">Click Power: 1</div>

<div id="diamond" onclick="clickDiamond()">
    <div id="diamondText">CLICK</div>
</div>

<!-- Shop Arrow -->
<div id="shopArrow" onclick="openShop()">◀</div>

<!-- Shop -->
<div id="shop">

    <button id="closeShop" onclick="closeShop()">▶</button>

    <h2>🛒 Shop</h2>

    <button class="upgrade" onclick="buyUpgrade(2, 500)">
        ⚡ ×2 — 500 💎
    </button>

    <button class="upgrade" onclick="buyUpgrade(3, 2500)">
        🔥 ×3 — 2,500 💎
    </button>

    <button class="upgrade" onclick="buyUpgrade(4, 10000)">
        💎 ×4 — 10,000 💎
    </button>

    <button class="upgrade" onclick="buyUpgrade(5, 50000)">
        👑 ×5 — 50,000 💎
    </button>

</div>

<div id="message"></div>

<script>
    let diamonds = 0;
    let clickPower = 1;

    let redDiamondCooldown = false;

    function update() {
        document.getElementById("diamonds").textContent =
            "💎 " + diamonds;

        document.getElementById("power").textContent =
            "Click Power: " + clickPower;
    }

    function clickDiamond() {
        diamonds += clickPower;

        update();

        // 5% chance to spawn a red diamond
        if (Math.random() < 0.05 && !redDiamondCooldown) {
            spawnRedDiamond();
        }
    }

    function buyUpgrade(multiplier, cost) {

        if (diamonds >= cost) {

            diamonds -= cost;
            clickPower = multiplier;

            document.getElementById("message").textContent =
                "✅ Click Power is now ×" + multiplier + "!";

            update();

        } else {

            document.getElementById("message").textContent =
                "❌ You need " + cost + " 💎!";
        }
    }

    function openShop() {
        document.getElementById("shop").classList.add("open");
        document.getElementById("shopArrow").style.display = "none";
    }

    function closeShop() {
        document.getElementById("shop").classList.remove("open");
        document.getElementById("shopArrow").style.display = "block";
    }

    function spawnRedDiamond() {

        if (redDiamondCooldown) {
            return;
        }

        redDiamondCooldown = true;

        const red = document.createElement("div");

        red.className = "redDiamond";

        red.innerHTML =
            '<div class="redDiamondText">+100</div>';

        // Random vertical position
        red.style.top =
            (Math.random() * 60 + 15) + "%";

        red.onclick = function() {

            // Give 100 diamonds
            diamonds += 100;

            document.getElementById("message").textContent =
                "🎁 +100 FREE DIAMONDS!";

            update();

            red.remove();

            // Start a new 40-second cooldown
            redDiamondCooldown = true;

            setTimeout(function() {
                redDiamondCooldown = false;
            }, 40000);
        };

        document.body.appendChild(red);

        // Remove if it reaches the other side
        setTimeout(function() {

            if (red.parentNode) {
                red.remove();
            }

            // Start the 40-second cooldown
            setTimeout(function() {
                redDiamondCooldown = false;
            }, 40000);

        }, 8000);
    }

    update();
</script>

</body>
</html>
