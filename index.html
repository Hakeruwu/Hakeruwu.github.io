````html
<!DOCTYPE html>
<html>
<head>
    <title>Diamond Clicker</title>

    <style>
        /* Prevent selecting/underlining text */
        * {
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 60px;
        }

        #count {
            font-size: 45px;
            margin: 15px;
        }

        #power {
            margin-bottom: 35px;
        }

        /* Blue Diamond */
        #diamond {
            width: 110px;
            height: 110px;
            margin: auto;
            background: linear-gradient(135deg, white, #55dfff, #168cff);
            transform: rotate(45deg);
            border: 3px solid #b9f3ff;
            box-shadow: 0 0 25px #00cfff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #diamond:hover {
            box-shadow: 0 0 40px #00cfff;
        }

        #diamond:active {
            transform: rotate(45deg) scale(0.9);
        }

        #clickText {
            transform: rotate(-45deg);
            font-size: 18px;
            font-weight: bold;
        }

        /* Open Shop Arrow */
        #openArrow {
            position: fixed;
            right: 20px;
            top: 50%;
            font-size: 35px;
            cursor: pointer;
            background: #21262d;
            padding: 10px 15px;
            border-radius: 10px;
            z-index: 3;
        }

        #openArrow:hover,
        #closeArrow:hover {
            background: #30363d;
        }

        /* Shop */
        #shop {
            position: fixed;
            right: 0;
            top: 0;
            height: 100%;
            width: 300px;
            background: #161b22;
            border-left: 2px solid #30363d;
            padding: 25px;
            box-sizing: border-box;
            transform: translateX(100%);
            transition: 0.3s;
            z-index: 2;
        }

        #shop.open {
            transform: translateX(0);
        }

        #shop h2 {
            margin-top: 35px;
        }

        /* Close Shop Arrow */
        #closeArrow {
            position: absolute;
            left: 15px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
            background: #21262d;
            padding: 5px 12px;
            border-radius: 8px;
        }

        .upgrade {
            width: 100%;
            margin: 10px 0;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .upgrade:hover {
            background: #2ea043;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        /* Red Bonus Diamond */
        .redDiamond {
            position: fixed;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff7777, #ff0000, #8b0000);
            border: 2px solid #ffaaaa;
            transform: rotate(45deg);
            box-shadow: 0 0 20px red;
            cursor: pointer;
            z-index: 10;
            animation: moveDiamond 4s linear forwards;
        }

        .redDiamondText {
            transform: rotate(-45deg);
            font-size: 12px;
            font-weight: bold;
            margin-top: 14px;
            color: white;
        }

        @keyframes moveDiamond {
            from {
                left: -70px;
            }

            to {
                left: 110%;
            }
        }
    </style>
</head>

<body>

    <h1>💎 Diamond Clicker</h1>

    <div id="count">0 💎</div>

    <div id="power">Click Power: ×1</div>

    <!-- Main Diamond -->
    <div id="diamond" onclick="clickDiamond()">
        <div id="clickText">CLICK</div>
    </div>

    <!-- Arrow to open shop -->
    <div id="openArrow" onclick="openShop()">←</div>

    <!-- Shop -->
    <div id="shop">

        <!-- Arrow to close shop -->
        <div id="closeArrow" onclick="closeShop()">→</div>

        <h2>🛒 SHOP</h2>

        <button class="upgrade" onclick="buyUpgrade(2, 500)">
            ×2 — 500 💎
        </button>

        <button class="upgrade" onclick="buyUpgrade(3, 2500)">
            ×3 — 2,500 💎
        </button>

        <button class="upgrade" onclick="buyUpgrade(4, 10000)">
            ×4 — 10,000 💎
        </button>

        <button class="upgrade" onclick="buyUpgrade(5, 50000)">
            ×5 — 50,000 💎
        </button>

        <div id="message"></div>

    </div>

    <script>
        let diamonds = 0;
        let clickPower = 1;

        function clickDiamond() {
            diamonds += clickPower;
            update();

            // 20% chance to spawn a red diamond
            if (Math.random() < 0.20) {
                spawnRedDiamond();
            }
        }

        function openShop() {
            document.getElementById("shop").classList.add("open");
            document.getElementById("openArrow").style.display = "none";
        }

        function closeShop() {
            document.getElementById("shop").classList.remove("open");
            document.getElementById("openArrow").style.display = "block";
        }

        function buyUpgrade(multiplier, cost) {

            if (diamonds < cost) {
                document.getElementById("message").textContent =
                    "You need " + cost.toLocaleString() + " 💎!";
                return;
            }

            diamonds -= cost;
            clickPower = multiplier;

            document.getElementById("message").textContent =
                "Upgrade bought! Click Power: ×" + multiplier;

            update();
        }

        function spawnRedDiamond() {

            if (document.querySelector(".redDiamond")) {
                return;
            }

            const red = document.createElement("div");
            red.className = "redDiamond";

            red.innerHTML = '<div class="redDiamondText">+100</div>';

            red.style.top =
                (Math.random() * 70 + 15) + "%";

            red.onclick = function() {
                diamonds += 100;

                document.getElementById("message").textContent =
                    "🎁 +100 FREE DIAMONDS!";

                update();
                red.remove();
            };

            document.body.appendChild(red);

            setTimeout(function() {
                if (red.parentNode) {
                    red.remove();
                }
            }, 4000);
        }

        function update() {
            document.getElementById("count").textContent =
                diamonds.toLocaleString() + " 💎";

            document.getElementById("power").textContent =
                "Click Power: ×" + clickPower;
        }
    </script>

</body>
</html>
```
