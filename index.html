
<!DOCTYPE >
<html>
<>
    <title>Diamond Clicker</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
        }

        #count {
            font-size: 50px;
            margin-bottom: 30px;
        }

        /* Diamond button */
        #diamond {
            width: 120px;
            height: 120px;
            background: linear-gradient(
                135deg,
                #ffffff,
                #70e1ff,
                #2196f3,
                #ffffff
            );

            transform: rotate(45deg);
            border: 4px solid #b9f3ff;
            box-shadow:
                0 0 20px #00cfff,
                0 0 40px #008cff;

            cursor: pointer;
            transition: 0.15s;
        }

        #diamond:hover {
            box-shadow:
                0 0 30px #00eaff,
                0 0 60px #008cff;

            transform: rotate(45deg) scale(1.08);
        }

        #diamond:active {
            transform: rotate(45deg) scale(0.92);
        }

        #text {
            transform: rotate(-45deg);
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>

<body>

    <h1>💎 Diamond Clicker</h1>

    <div id="count">0</div>

    <div id="diamond" onclick="clickDiamond()">
        <div id="text">CLICK</div>
    </div>

    <script>
        let diamonds = 0;

        function clickDiamond() {
            diamonds++;
            document.getElementById("count").textContent = diamonds;
        }
    </script>

</body>
</html>
