```html
<!DOCTYPE html>
<html>
<head>
    <title>Diamond Clicker</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 60px;
        }

        #count {
            font-size: 45px;
            margin: 15px;
        }

        #power {
            margin-bottom: 35px;
        }

        /* Diamond */
        #diamond {
            width: 110px;
            height: 110px;
            margin: auto;
            background: linear-gradient(135deg, white, #55dfff, #168cff);
            transform: rotate(45deg);
            border: 3px solid #b9f3ff;
            box-shadow: 0 0 25px #00cfff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #diamond:hover {
            box-shadow: 0 0 40px #00cfff;
        }

        #diamond:active {
            transform: rotate(45deg) scale(0.9);
        }

        #clickText {
            transform: rotate(-45deg);
            font-size: 18px;
            font-weight: bold;
        }

        /* Arrow */
        #arrow {
            position: fixed;
            right: 20px;
            top: 50%;
            font-size: 35px;
            cursor: pointer;
            background: #21262d;
            padding: 10px 15px;
            border-radius: 10px;
            transition: 0.2s;
            z-index: 2;
        }

        #arrow:hover {
            background: #30363d;
        }

        /* Shop */
        #shop {
            position: fixed;
            right: 0;
            top: 0;
            height: 100%;
            width: 280px;
            background: #161b22;
            border-left: 2px solid #30363d;
            padding: 25px;
            box-sizing: border-box;
            transform: translateX(100%);
            transition: 0.3s;
            z-index: 1;
        }

        #shop.open {
            transform: translateX(0);
        }

        #shop h2 {
            margin-top: 40px;
        }

        .upgrade {
            width: 100%;
            margin: 10px 0;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .upgrade:hover {
            background: #2ea043;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>💎 Diamond Clicker</h1>

    <div id="count">0 💎</div>

    <div id="power">Click Power: ×1</div>

    <div id="diamond" onclick="clickDiamond()">
        <div id="clickText">CLICK</div>
    </div>

    <!-- Shop Arrow -->
    <div id="arrow" onclick="toggleShop()">←</div>

    <!-- Shop -->
    <div id="shop">

        <h2>🛒 SHOP</h2>

        <button class="upgrade" onclick="buyUpgrade(2, 100)">
            ×2 — 100 💎
        </button>

        <button class="upgrade" onclick="buyUpgrade(3, 500)">
            ×3 — 500 💎
        </button>

        <button class="upgrade" onclick="buyUpgrade(4, 1000)">
            ×4 — 1,000 💎
        </button>

        <button class="upgrade" onclick="buyUpgrade(5, 5000)">
            ×5 — 5,000 💎
        </button>

        <div id="message"></div>

    </div>

    <script>
        let diamonds = 0;
        let clickPower = 1;

        function clickDiamond() {
            diamonds += clickPower;
            update();
        }

        function toggleShop() {
            const shop = document.getElementById("shop");
            const arrow = document.getElementById("arrow");

            shop.classList.toggle("open");

            if (shop.classList.contains("open")) {
                arrow.textContent = "→";
            } else {
                arrow.textContent = "←";
            }
        }

        function buyUpgrade(multiplier, cost) {

            if (diamonds < cost) {
                document.getElementById("message").textContent =
                    "You need " + cost + " 💎!";
                return;
            }

            diamonds -= cost;
            clickPower = multiplier;

            document.getElementById("message").textContent =
                "Click Power is now ×" + multiplier + "!";

            update();
        }

        function update() {
            document.getElementById("count").textContent =
                diamonds.toLocaleString() + " 💎";

            document.getElementById("power").textContent =
                "Click Power: ×" + clickPower;
        }
    </script>

</body>
</html>
```
